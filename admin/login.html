<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <base href="/admin/" />
  <script>
    // 🛡️ LinkAdda Admin Anti-Clone Domain Lock & Hardened Anti-Inspect Shield
    (function protectAdmin() {
      var h = (window.location.hostname || '').toLowerCase();
      var p = window.location.protocol;
      var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '' || p === 'file:';
      var isAuthorized = isLocal || h === 'linkadda.online' || h === 'www.linkadda.online';

      if (!isAuthorized) {
        try { if (window.stop) window.stop(); } catch (_) {}
        window.location.replace('https://linkadda.online/');
        return;
      }

      if (window.top !== window.self) {
        try { window.top.location.replace(window.self.location.href); } catch (_) { window.location.replace('https://linkadda.online/'); }
      }

      if (!isLocal) {
        var path = window.location.pathname;
        var cleanPath = null;
        if (path.endsWith('/index.html')) {
          cleanPath = path.substring(0, path.length - 10) || '/';
        } else if (path.endsWith('.html')) {
          cleanPath = path.substring(0, path.length - 5);
        }
        if (cleanPath !== null) {
          window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
        }
      }

      // 🔒 1. Disable Right-Click Context Menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, { capture: true });

      // 🔒 2. Block Inspect Keyboard Shortcuts (F12, Ctrl+Shift+I/J/C/K, Ctrl+U, Ctrl+S)
      window.addEventListener('keydown', function(e) {
        var key = (e.key || '').toUpperCase();
        var code = e.keyCode || 0;
        var isCtrlOrMeta = e.ctrlKey || e.metaKey;
        var isShift = e.shiftKey;

        if (key === 'F12' || code === 123) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        if (isCtrlOrMeta && isShift && (key === 'I' || key === 'J' || key === 'C' || key === 'K')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        if (isCtrlOrMeta && (key === 'U' || code === 85)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        if (isCtrlOrMeta && (key === 'S' || code === 83)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { capture: true });

      // 🔒 3. Active DevTools Detector (Non-local)
      if (!isLocal) {
        var devtoolsActive = false;
        var threshold = 160;

        function triggerDevtoolsBlock() {
          if (devtoolsActive) return;
          devtoolsActive = true;
          try { console.clear(); } catch (_) {}
          document.body.innerHTML = '<div style="position:fixed;inset:0;background:#06080e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;text-align:center;padding:24px;z-index:99999999;"><div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#dc2626);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 30px rgba(239,68,68,0.4);margin-bottom:20px;">🛡️</div><h2 style="font-size:22px;font-weight:800;margin:0 0 8px 0;letter-spacing:-0.02em;">Security Restriction Active</h2><p style="color:#94a3b8;font-size:14px;max-width:380px;line-height:1.5;margin:0 0 24px 0;">Developer tools and inspecting are strictly prohibited in LinkAdda Secure Admin.</p><button onclick="window.location.replace(\'/\')" style="padding:10px 24px;background:#6366f1;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;">Return to Safe Store</button></div>';
          setTimeout(function() {
            window.location.replace('/');
          }, 2000);
        }

        setInterval(function() {
          if ((window.outerWidth - window.innerWidth > threshold) || (window.outerHeight - window.innerHeight > threshold)) {
            triggerDevtoolsBlock();
          }
        }, 1200);

        // Silence production console
        try {
          var noop = function() {};
          window.console.log = noop;
          window.console.warn = noop;
          window.console.info = noop;
          window.console.debug = noop;
          window.console.table = noop;
        } catch (_) {}
      }
    })();
  </script>

<body data-theme="dark">
  <main id="authMount"></main>
  <script type="module">
    import { mountLoginPage, whenAuthenticated } from '/admin/js/auth.js?v=20261013_v1';
    const mount = document.getElementById('authMount');
    whenAuthenticated((user) => {
      const email = String(user?.email || '').trim().toLowerCase();
      if (user && email === 'botforword@gmail.com') {
        window.location.replace('/admin');
      }
    });
    mountLoginPage(mount);
