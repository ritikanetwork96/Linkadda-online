<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <base href="/admin/" />
  <script>
    // 🛡️ LinkAdda Admin Anti-Clone Domain Lock & Security Shield
    (function protectAdmin() {
      var h = (window.location.hostname || '').toLowerCase();
      var p = window.location.protocol;
      var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '' || p === 'file:';
      var isAuthorized = isLocal || h === 'linkadda.online' || h === 'www.linkadda.online' || h.endsWith('.pages.dev');

      if (!isAuthorized) {
        try { if (window.stop) window.stop(); } catch (_) {}
        window.location.replace('https://linkadda.online/');
        return;
      }

      if (window.top !== window.self) {
        try { window.top.location.replace(window.self.location.href); } catch (_) { window.location.replace('https://linkadda.online/'); }
      }

      if (!isLocal) {
        var path = window.location.pathname;
        var cleanPath = null;
        if (path.endsWith('/index.html')) {
          cleanPath = path.substring(0, path.length - 10) || '/';
        } else if (path.endsWith('.html')) {
          cleanPath = path.substring(0, path.length - 5);
        }
        if (cleanPath !== null) {
          window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
        }
      }

      // 🔒 1. Disable Right-Click Context Menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, { capture: true });

      // 🔒 2. Block Inspect Keyboard Shortcuts (F12, Ctrl+Shift+I/J/C/K, Ctrl+U, Ctrl+S)
      window.addEventListener('keydown', function(e) {
        var key = (e.key || '').toUpperCase();
        var code = e.keyCode || 0;
        var isCtrlOrMeta = e.ctrlKey || e.metaKey;
        var isShift = e.shiftKey;

        if (key === 'F12' || code === 123) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        if (isCtrlOrMeta && isShift && (key === 'I' || key === 'J' || key === 'C' || key === 'K')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        if (isCtrlOrMeta && (key === 'U' || code === 85)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        if (isCtrlOrMeta && (key === 'S' || code === 83)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { capture: true });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Linkadda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20261013_v2" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@latest';"></script>
</head>
<body data-theme="dark">
  <main id="authMount"></main>
  <script type="module">
    import { mountLoginPage, whenAuthenticated } from '/admin/js/auth.js?v=20261013_v2';
    const mount = document.getElementById('authMount');
    whenAuthenticated((user) => {
      const email = String(user?.email || '').trim().toLowerCase();
      if (user && email === 'botforword@gmail.com') {
        window.location.replace('/admin/');
      }
    });
    mountLoginPage(mount);
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
