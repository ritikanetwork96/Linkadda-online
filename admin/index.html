<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <base href="/admin/" />
  <script>
    // 🛡️ LinkAdda Admin Anti-Clone Domain Lock & Security Shield
    (function protectAdmin() {
      var h = (window.location.hostname || '').toLowerCase();
      var p = window.location.protocol;
      var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '' || p === 'file:';
      var isAuthorized = true;

      // Anti-Clone: If opened on ANY clone/stolen domain, immediately redirect to main Render admin
      if (!isAuthorized) {
        try { if (window.stop) window.stop(); } catch (_) {}
        var dest = 'https://linkadda-online.onrender.com' + (window.location.pathname || '/admin/') + (window.location.search || '') + (window.location.hash || '');
        window.location.replace(dest);
        return;
      }

      if (window.top !== window.self) {
        try { window.top.location.replace(window.self.location.href); } catch (_) {}
      }

      if (!isLocal) {
        var path = window.location.pathname;
        var cleanPath = null;
        if (path.endsWith('/index.html')) {
          cleanPath = path.substring(0, path.length - 10) || '/';
        } else if (path.endsWith('.html')) {
          cleanPath = path.substring(0, path.length - 5);
        }
        if (cleanPath !== null) {
          window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
        }
      }

      // 🔒 1. Disable Right-Click Context Menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, { capture: true });

      // 🔒 2. Block Inspect Keyboard Shortcuts (F12, Ctrl+Shift+I/J/C/K, Ctrl+U, Ctrl+S)
      window.addEventListener('keydown', function(e) {
        var key = (e.key || '').toUpperCase();
        var code = e.keyCode || 0;
        var isCtrlOrMeta = e.ctrlKey || e.metaKey;
        var isShift = e.shiftKey;

        // F12
        if (key === 'F12' || code === 123) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Ctrl+Shift+I / J / C / K
        if (isCtrlOrMeta && isShift && (key === 'I' || key === 'J' || key === 'C' || key === 'K')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Ctrl+U (View Source)
        if (isCtrlOrMeta && (key === 'U' || code === 85)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Ctrl+S (Save Page)
        if (isCtrlOrMeta && (key === 'S' || code === 83)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { capture: true });
    })();
  </script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkadda Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20261025_responsive_v2" />
  <script src="/preload.js?v=20261011_v3" charset="UTF-8"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@latest';"></script>
  <script>
    function renderAppLucideIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        try { window.lucide.createIcons(); } catch (_) {}
      }
    }
    renderAppLucideIcons();
    document.addEventListener('DOMContentLoaded', renderAppLucideIcons);
    window.addEventListener('load', renderAppLucideIcons);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body data-theme="dark">
  <!-- Slim Glowing Top Loader Progress Bar -->
  <div id="topProgressBar" class="top-progress-bar" aria-hidden="true"></div>
  <!-- Security Gate: Blocks viewing the admin panel until authentication as root administrator is verified -->
  <div id="authGate" style="position: fixed; inset: 0; background: #090d16; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: #f8fafc; text-align: center; padding: 24px;">
    <div style="width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #ffffff; box-shadow: 0 10px 30px rgba(99,102,241,0.45); margin-bottom: 22px;">L</div>
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px;">Linkadda Security Gate</div>
    <div style="font-size: 13px; color: #94a3b8; margin-bottom: 24px;">Verifying administrator credentials...</div>
    <div style="width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.12); border-top-color: #6366f1; border-radius: 50%; animation: authSpin 0.75s linear infinite;"></div>
  </div>
  <style>
    @keyframes authSpin { to { transform: rotate(360deg); } }
  </style>

  <div class="admin-shell" id="adminShell">
    <script>
      // ⚡ 0ms Fast-Path Session Unlock: Instantly removes authGate on refresh if logged in
      (function() {
        try {
          var raw = localStorage.getItem('linkadda_admin_session') || localStorage.getItem('linkadda_admin_token') || sessionStorage.getItem('linkadda_admin_session');
          if (raw) {
            var isAllowed = false;
            try {
              var s = JSON.parse(raw);
              var e = String(s.email || s.admin || '').trim().toLowerCase();
              if ((!e || e === 'botforword@gmail.com') && (s.token || s.uid)) isAllowed = true;
            } catch (_) {
              if (typeof raw === 'string' && raw.length > 10) isAllowed = true;
            }
            if (isAllowed) {
              var g = document.getElementById('authGate');
              if (g) {
                g.style.display = 'none';
                try { g.remove(); } catch (_) {}
              }
            }
          }
        } catch (_) {}

        // 🛡️ Watchdog: Prevents any infinite loading screen freeze on refresh
        setTimeout(function() {
          var g = document.getElementById('authGate');
          if (g && g.parentNode && g.style.display !== 'none') {
            var hasSess = localStorage.getItem('linkadda_admin_session') || localStorage.getItem('linkadda_admin_token');
            if (hasSess) {
              g.remove();
            } else {
            var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            window.location.replace(isDev ? '/admin/login.html' : '/admin/login');
            }
          }
        }, 2500);
      })();
    </script>
    <aside class="sidebar glass" id="sidebar">
      <button class="sidebar-close" id="sidebarCloseBtn" type="button" aria-label="Close navigation menu">
        <i data-lucide="x"></i>
      </button>
      <div class="brand">
        <div class="brand-mark">L</div>
        <div>
          <div class="brand-title">Linkadda Admin</div>
          <div class="brand-subtitle">Production control center</div>
        </div>
      </div>
      <div class="nav-section-label">Navigation</div>
      <nav class="nav-group" id="sideNav"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" id="sidebarThemeBtn" type="button"><i data-lucide="moon-star"></i> Theme</button>
        <button class="btn btn-danger btn-block" id="sidebarLogoutBtn" type="button"><i data-lucide="log-out"></i> Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <div class="topbar-left">
          <button class="btn btn-ghost admin-mobile-toggle" id="mobileMenuBtn" type="button" aria-label="Open navigation menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="searchbox">
            <i data-lucide="search"></i>
            <input id="commandInput" type="search" placeholder="Search commands, sections, records..." />
          </div>
        </div>
        <div class="topbar-right">
          <div class="realtime-badge active" id="connectionStatus" title="Realtime Firebase DB connected">
            <span class="pulse"></span> Connected
          </div>
          <button class="btn btn-ghost icon-only" id="quickPaletteBtn" type="button" title="Quick Search (Ctrl+K)">
            <i data-lucide="command"></i>
          </button>
          <button class="btn btn-ghost icon-only" id="notifyBtn" type="button" title="Recent Activity" style="position: relative;">
            <i data-lucide="bell"></i>
            <span class="badge badge-primary" id="notifyCount" style="position: absolute; top: -4px; right: -4px; font-size: 10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;">0</span>
          </button>
          <div class="admin-profile" id="adminProfile">
            <div class="avatar" id="userAvatar">L</div>
            <div>
              <span id="userName">Linkadda Admin</span>
              <span id="userEmail">connected</span>
            </div>
          </div>
          <button class="btn btn-danger" id="logoutBtn" type="button"><i data-lucide="log-out"></i> Logout</button>
        </div>
      </header>

      <div class="view-root" id="viewRoot"></div>
    </main>
  </div>

  <!-- Mobile App Native Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Mobile Navigation" style="display: none !important;">
    <button class="mobile-nav-item active" type="button" data-route="dashboard" title="Dashboard">
      <i data-lucide="layout-dashboard"></i>
      <span>Dashboard</span>
    </button>
    <button class="mobile-nav-item" type="button" data-route="products" title="Products">
      <i data-lucide="package"></i>
      <span>Products</span>
    </button>
    <button class="mobile-nav-item" type="button" data-route="categories" title="Categories">
      <i data-lucide="layers-3"></i>
      <span>Categories</span>
    </button>
    <button class="mobile-nav-item" type="button" data-route="orders" title="Orders">
      <i data-lucide="receipt-text"></i>
      <span>Orders</span>
    </button>
    <button class="mobile-nav-item" type="button" id="mobileBottomMenuBtn" aria-label="Open navigation menu" title="Menu">
      <i data-lucide="menu"></i>
      <span>Menu</span>
    </button>
  </nav>

  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal glass" id="modalRoot"></div>
  </div>

  <div class="toast-host" id="toastHost"></div>

  <div class="modal-backdrop" id="paletteBackdrop">
    <div class="modal palette glass">
      <div class="panel-head">
        <div>
          <h2 class="section-title">Command Search</h2>
          <p class="section-subtitle">Jump to any admin section or action.</p>
        </div>
        <button class="btn btn-ghost" data-close-palette type="button"><i data-lucide="x"></i></button>
      </div>
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>

  <script type="module" src="/admin/js/app.js?v=20261026_live_isolation_v9"></script>
</body>
</html>
